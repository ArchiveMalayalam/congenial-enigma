services:
  jekyll:
    build:
      context: ./jekyll
      dockerfile: ../.devcontainer/Dockerfile
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - JEKYLL_ENV=production
    volumes:
      - .:/workspace
    command: bash -c "cd /workspace/jekyll && bundle install && bundle exec jekyll serve --livereload --host 0.0.0.0"

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    working_dir: /workspace
    environment:
      - DATABASE_URL=postgres://archive_user:archive_password@db:5432/ocr_results
    volumes:
      - .:/workspace
    depends_on:
      - db
    command: bash -c "npm install -g pnpm && cd scripts && pnpm install && node ocr.js"
    restart: unless-stopped

  indictrans:
    build:
      context: ./services/indictrans
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGINGFACE_HUB_TOKEN}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archive_user
      POSTGRES_PASSWORD: archive_password
      POSTGRES_DB: ocr_results
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: